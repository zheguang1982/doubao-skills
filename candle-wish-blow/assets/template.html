<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>关灯・许愿・吹蜡烛</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@200;300;400&display=swap">
<style>
@property --lit{syntax:"<number>";inherits:false;initial-value:0;}
@property --stretch{syntax:"<number>";inherits:true;initial-value:1;}
@property --shear{syntax:"<number>";inherits:true;initial-value:0;}
@property --tilt{syntax:"<angle>";inherits:true;initial-value:0deg;}
/* ================================================================
   视觉方向（16:9 大屏版）
   世界    生日那天晚上的一间餐厅，整面 16:9 的墙就是舞台
   事件    关灯 → 蛋糕在烛光里现身 → 三根蜡烛依次点亮 → 一口气吹灭
   材质    奶油、蜡、烟、空气里的浮尘、暖橙色的光
   配色    午夜靛蓝 #04030b / 烛焰橙 #ff7a1a / 焰心 #fff8e0
   签名    气流实时把火苗吹弯——风力越大歪得越狠，撤气就弹回来
   音乐    生日快乐 MIDI 音序（Web Audio 现场合成，无外部音频依赖）
   ================================================================ */
:root{
  --ink:#04030b;
  --wax:#f6efe2;
  --f-out:#ff7a1a;
  --f-mid:#ffb545;
  --f-core:#fff8e0;
  --mint:#7fe3c4;
  --day:url("https://aka.doubaocdn.com/s/L2qHj7u5gr");
  --night:url("https://aka.doubaocdn.com/s/uu4pCYsnCC");
  --f-disp:"Noto Serif SC","Songti SC",serif;
  --f-hand:"Ma Shan Zheng","Kaiti SC",cursive;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB",sans-serif;
  --glow:0;      /* 烛光总量 */
  --tilt:0deg;   /* 气流偏角 */
  --shear:0;     /* 气流剪切 */
  --stretch:1;
  --shudder:0;   /* 全局风感 */
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;overflow:hidden;}
body{
  background:var(--ink);
  font-family:var(--f-body);
  color:var(--wax);
  -webkit-font-smoothing:antialiased;
}

/* ===== 舞台：16:9，永远完整落在屏幕里 ===== */
.stage{
  position:fixed;inset:0;
  display:grid;place-items:center;
}
.frame{
  position:relative;
  width:min(100vw, calc(100dvh * 16 / 9));
  height:min(100dvh, calc(100vw * 9 / 16));
  aspect-ratio:16 / 9;
  overflow:hidden;
  background:#000;
  transform:translateX(calc(var(--shudder) * 2px));
  box-shadow:0 40px 120px rgba(0,0,0,.75);
}
/* 场景框：永远保持 16:9 的画面比例。
   底图、火焰、青烟都住在这里，所以火焰百分比与烛芯像素永久对齐，
   哪怕屏幕不是 16:9、场景被裁切放大也一样。 */
.scene{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  width:100%;aspect-ratio:16 / 9;
  overflow:hidden;
}
/* 两张 16:9 底图叠放，交叉淡入 —— 关灯不是滤镜，是换一个房间 */
.plate{
  position:absolute;inset:0;
  background-size:100% 100%;   /* 铺满即等比例：火焰百分比与烛芯像素一一对应 */
  background-position:center;
  background-repeat:no-repeat;
}
.plate.day{
  background-image:var(--day);
  opacity:1;
  transition:opacity 1.15s cubic-bezier(.7,0,.3,1);
}
.plate.night{
  background-image:var(--night);
  opacity:0;
  transition:opacity 1.15s cubic-bezier(.7,0,.3,1);
}
body.dark .plate.day{opacity:0;}
body.dark .plate.night{opacity:1;}
/* 关灯瞬间的一记全黑，吃掉两图的细微位移，也吃掉"蛋糕出现的魔术" */
.blackout{
  position:absolute;inset:0;background:#000;
  opacity:0;pointer-events:none;
}
.blackout.flash{animation:blackout-flash 1.15s ease-in-out;}
@keyframes blackout-flash{
  0%{opacity:0;}
  38%{opacity:1;}
  62%{opacity:1;}
  100%{opacity:0;}
}
/* 屏幕外那一圈补齐：同图放大模糊铺底 */
.bleed{
  position:fixed;inset:-12%;z-index:-1;
  background-image:var(--night);
  background-size:cover;background-position:center;
  filter:blur(70px) brightness(.62);
  transition:filter 1.15s ease;
}
body.dark .bleed{filter:blur(70px) brightness(.16);}
/* 烛光在环境里的溢出：压在整个蛋糕上 */
.spill{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 26% 30% at 50.3% 56%, rgba(255,178,86,.62) 0%, rgba(255,140,40,.24) 44%, rgba(255,120,30,0) 74%),
    radial-gradient(ellipse 64% 48% at 50.3% 64%, rgba(255,150,60,.26) 0%, rgba(255,120,40,0) 72%),
    radial-gradient(ellipse 16% 12% at 50.3% 34%, rgba(255,196,120,.30) 0%, rgba(255,150,60,0) 80%);
  mix-blend-mode:screen;
  opacity:0;
  transition:opacity .45s ease;
}
/* 暗角 */
.vignette{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 66% at 50% 52%, transparent 26%, rgba(4,3,12,.56) 76%, rgba(3,2,9,.94) 100%);
  opacity:0;
  transition:opacity 1.15s ease;
}
body.dark .vignette{opacity:1;}
/* 顶部压暗，给题字留出读得清的地 */
.scrim-top{
  position:absolute;left:0;right:0;top:0;height:26%;pointer-events:none;
  background:linear-gradient(to bottom, rgba(6,5,16,.62) 0%, rgba(6,5,16,.22) 52%, rgba(6,5,16,0) 100%);
}

/* ================================================================
   火焰 —— 主角，多层叠加
   坐标 = 底图里三根蜡烛的烛芯像素位置（百分比，随舞台等比缩放）
   左 46.41% / 中 50.26% / 右 54.18%，蜡面顶端 y = 40.3% / 40.05% / 40.25%
   ================================================================ */
.flame{
  --lit:0;
  position:absolute;
  width:.88%;
  aspect-ratio:1 / 2.2;
  transform:translateX(-50%) rotate(var(--tilt)) skewX(calc(var(--shear) * 1deg)) scaleY(calc(var(--lit) * var(--stretch)));
  transform-origin:50% 100%;
  opacity:var(--lit);
  transition:opacity .3s ease, transform .1s linear;
  will-change:transform;
}
.flame > *{position:absolute;}
/* 外焰 */
.f-outer{
  position:absolute;inset:0;
  background:radial-gradient(ellipse 60% 50% at 50% 78%,
      var(--f-out) 0%, rgba(255,110,20,.72) 45%, rgba(255,90,10,0) 78%);
  border-radius:50% 50% 45% 45% / 66% 66% 34% 34%;
  clip-path:polygon(50% 0%,68% 22%,84% 52%,78% 80%,50% 100%,22% 80%,16% 52%,32% 22%);
  filter:blur(1.1px);
  animation:dance 1.45s ease-in-out infinite;
}
/* 中焰 */
.f-mid{
  position:absolute;left:50%;bottom:0;
  width:70%;height:78%;transform:translateX(-50%);
  background:linear-gradient(to top,
      rgba(255,120,20,.9) 0%, var(--f-mid) 42%, rgba(255,220,150,.95) 82%, rgba(255,248,224,1) 100%);
  border-radius:50% 50% 44% 44% / 64% 64% 36% 36%;
  clip-path:polygon(50% 0%,70% 26%,82% 56%,74% 82%,50% 100%,26% 82%,18% 56%,30% 26%);
  filter:blur(.3px);
  animation:dance 1.15s ease-in-out infinite reverse;
}
/* 焰心 + 底部蓝焰 */
.f-core{
  position:absolute;left:50%;bottom:2%;
  width:38%;height:46%;transform:translateX(-50%);
  background:linear-gradient(to top,
      rgba(90,150,255,.85) 0%, rgba(180,210,255,.7) 26%, var(--f-core) 62%, #fff 100%);
  border-radius:50% 50% 42% 42% / 60% 60% 40% 40%;
  filter:blur(.5px);
  animation:dance .82s ease-in-out infinite;
}
/* 光晕 */
.f-halo{
  position:absolute;left:50%;top:34%;
  width:620%;aspect-ratio:1;transform:translate(-50%,-50%);
  background:radial-gradient(circle,
      rgba(255,196,110,.5) 0%, rgba(255,150,55,.2) 30%, rgba(255,130,40,0) 66%);
  animation:breathe 2.4s ease-in-out infinite;
  pointer-events:none;
}
@keyframes dance{
  0%,100%{transform:translateX(-50%) scaleX(1)   scaleY(1);}
  20%    {transform:translateX(-47%) scaleX(.9)  scaleY(1.1);}
  45%    {transform:translateX(-53%) scaleX(1.08) scaleY(.93);}
  70%    {transform:translateX(-49%) scaleX(.95) scaleY(1.05);}
}
.f-outer{animation-name:dance-o;}
@keyframes dance-o{
  0%,100%{transform:scaleX(1) scaleY(1);}
  25%{transform:scaleX(.88) scaleY(1.12) translateX(3%);}
  55%{transform:scaleX(1.1) scaleY(.9) translateX(-3%);}
  80%{transform:scaleX(.94) scaleY(1.06) translateX(1%);}
}
@keyframes breathe{
  0%,100%{opacity:.8;transform:translate(-50%,-50%) scale(1);}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.16);}
}

/* 青烟 */
.smoke{
  position:absolute;width:1.1%;aspect-ratio:1;transform:translateX(-50%);
  border-radius:50%;
  background:radial-gradient(circle, rgba(226,222,238,.46), rgba(200,198,220,0) 70%);
  opacity:0;pointer-events:none;
}
.smoke.go{animation:rise 3.2s ease-out forwards;}
@keyframes rise{
  0%{opacity:0;transform:translate(-50%,0) scale(.4);}
  16%{opacity:.7;}
  100%{opacity:0;transform:translate(calc(-50% + 26px),-190px) scale(3.6);}
}

.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}

/* ================================================================
   题字
   ================================================================ */
.crest{
  position:absolute;top:clamp(16px,3.4vh,44px);left:50%;
  transform:translateX(-50%);z-index:6;text-align:center;
  transition:opacity .9s ease;
  pointer-events:none;
}
.crest p{margin:0;}
.crest .zh{
  font-family:var(--f-disp);font-weight:900;
  font-size:clamp(24px,5vmin,76px);letter-spacing:.4em;text-indent:.4em;
  color:rgba(246,239,226,.94);
  text-shadow:0 0 40px rgba(0,0,0,.6), 0 2px 18px rgba(0,0,0,.55);
}
.crest .en{
  margin-top:clamp(4px,.9vh,10px);font-size:clamp(8px,1.15vmin,13px);
  letter-spacing:.56em;text-indent:.56em;
  color:rgba(246,239,226,.44);text-transform:uppercase;
}

/* ================================================================
   UI —— 16:9 用横向条：左边文，右边操作
   ================================================================ */
.hud{
  position:absolute;left:0;right:0;bottom:0;z-index:7;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:end;
  gap:clamp(18px,3.4vw,64px);
  padding:clamp(56px,9vh,96px) clamp(20px,4.4vw,64px) clamp(16px,3vh,30px);
  background:linear-gradient(to top,
    rgba(3,2,9,.97) 0%, rgba(3,2,9,.88) 28%, rgba(3,2,9,.52) 62%, rgba(3,2,9,0) 100%);
  text-align:left;
}
.hud-l{display:flex;flex-direction:column;align-items:flex-start;gap:clamp(6px,1.1vh,12px);min-width:0;}
.hud-r{display:flex;flex-direction:column;align-items:flex-end;gap:clamp(8px,1.4vh,14px);}

.kicker{
  margin:0;font-size:clamp(9px,1.1vmin,12px);font-weight:300;
  letter-spacing:.62em;text-indent:.62em;
  color:rgba(246,239,226,.44);text-transform:uppercase;
}
.title{
  margin:0;font-family:var(--f-disp);font-weight:600;
  font-size:clamp(24px,3.6vmin,50px);letter-spacing:.1em;line-height:1.2;
  text-shadow:0 0 34px rgba(255,160,70,.34);
}
.desc{
  margin:0;font-size:clamp(12.5px,1.45vmin,18px);line-height:1.7;font-weight:200;
  color:rgba(246,239,226,.64);max-width:36em;
}
.desc em{font-style:normal;color:var(--mint);font-weight:400;}

.btn{
  font:500 14px/1 var(--f-body);letter-spacing:.2em;text-indent:.2em;
  color:#1a1526;background:linear-gradient(to bottom,#fff8ec,#ffdfb4);
  border:none;border-radius:999px;padding:15px 44px;min-height:48px;cursor:pointer;
  box-shadow:0 8px 30px rgba(255,168,80,.26), inset 0 -2px 0 rgba(0,0,0,.09);
  transition:transform .18s, box-shadow .18s;
  white-space:nowrap;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 13px 38px rgba(255,168,80,.4);}
.btn:active{transform:translateY(0);}
.btn:focus-visible{outline:2px solid var(--mint);outline-offset:3px;}
.btn.ghost{
  background:none;color:rgba(246,239,226,.6);
  border:1px solid rgba(246,239,226,.24);box-shadow:none;
  padding:12px 24px;font-size:12.5px;min-height:44px;
}
.btn.ghost:hover{color:var(--wax);transform:none;box-shadow:none;}

.field{width:min(460px,100%);margin-top:clamp(4px,.8vh,8px);}
.wish{
  width:100%;font-family:var(--f-hand);font-size:clamp(18px,2.2vmin,26px);line-height:1.5;
  text-align:left;color:var(--wax);
  background:rgba(246,239,226,.05);
  border:none;border-bottom:1px solid rgba(246,239,226,.2);
  border-radius:10px 10px 0 0;padding:12px 16px;
}
.wish::placeholder{color:rgba(246,239,226,.28);font-size:.9em;font-family:var(--f-body);letter-spacing:.04em;}
.wish:focus{outline:none;border-bottom-color:var(--mint);background:rgba(246,239,226,.09);}

/* 风力计 —— 签名交互的读数 */
.gauge{width:clamp(180px,24vw,320px);display:flex;flex-direction:column;gap:8px;}
.bar{position:relative;height:5px;border-radius:99px;background:rgba(246,239,226,.13);overflow:hidden;}
.bar-fill{
  position:absolute;inset:0 auto 0 0;width:0%;border-radius:99px;
  background:linear-gradient(90deg,var(--mint),var(--f-mid),var(--f-out));
  transition:width .1s linear;
}
.bar-live{
  position:absolute;top:-4px;bottom:-4px;left:0;width:2px;border-radius:2px;
  background:#fff;box-shadow:0 0 10px rgba(255,255,255,.8);
  transition:left .07s linear;
}
.gauge-txt{
  display:flex;justify-content:space-between;
  font-size:clamp(9px,1.1vmin,12px);letter-spacing:.2em;color:rgba(246,239,226,.42);
}
.gauge-txt b{font-weight:400;font-variant-numeric:tabular-nums;}

.echo{
  margin:0;font-family:var(--f-hand);
  font-size:clamp(22px,3.1vmin,42px);line-height:1.4;
  text-shadow:0 0 36px rgba(255,196,116,.44);word-break:break-word;
  max-width:38em;
}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end;align-items:center;}
.tip{margin:0;font-size:clamp(10px,1.15vmin,13px);line-height:1.6;color:rgba(246,239,226,.38);text-align:right;}
.hidden{display:none!important;}

/* 音乐开关 */
.audio-btn{
  position:absolute;right:clamp(10px,1.6vw,22px);top:clamp(10px,1.6vh,22px);
  z-index:30;
  width:38px;height:38px;border-radius:50%;
  border:1px solid rgba(246,239,226,.2);
  background:rgba(10,8,20,.5);
  color:rgba(246,239,226,.7);
  display:grid;place-items:center;cursor:pointer;
  transition:color .2s, border-color .2s, background .2s;
}
.audio-btn:hover{color:#fff;border-color:rgba(246,239,226,.45);}
.audio-btn:focus-visible{outline:2px solid var(--mint);outline-offset:2px;}
.audio-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;}
.audio-btn .off-slash{opacity:0;}
.audio-btn.muted .off-slash{opacity:1;}
.audio-btn.muted .wave{opacity:0;}

/* 竖屏/窄屏兜底：舞台铺满整屏，场景按 16:9 等比裁切放大（蛋糕仍在正中），
   火焰住在场景框里，所以裁切不会让它和烛芯错位 */
@media (max-aspect-ratio: 1 / 1){
  .frame{
    width:100vw;height:100dvh;
    aspect-ratio:auto;
    box-shadow:none;
  }
  .scene{width:auto;height:100%;}
  .hud{
    grid-template-columns:1fr;
    justify-items:center;text-align:center;
    gap:14px;
    padding:clamp(40px,7vh,70px) 18px calc(16px + env(safe-area-inset-bottom));
  }
  .hud-l{align-items:center;text-align:center;}
  .hud-r{align-items:center;width:100%;}
  .row{justify-content:center;}
  .tip{text-align:center;}
  .wish{text-align:center;}
}
@media (max-height:640px){
  .hud{padding-top:40px;gap:14px;}
  .title{font-size:clamp(20px,3.2vmin,34px);}
  .wish{font-size:17px;padding:10px 14px;}
}

@media (prefers-reduced-motion:reduce){
  .f-outer,.f-mid,.f-core,.f-halo{animation:none;}
  *{transition-duration:.01ms!important;}
}
</style>
</head>
<body>

<div class="bleed"></div>

<main class="stage">
  <div class="frame" id="frame">
    <div class="scene" id="scene">
      <div class="plate day"></div>
      <div class="plate night"></div>
      <div class="vignette"></div>
      <div class="spill"></div>

      <!-- 火焰：坐标取自暗场底图里三根蜡烛的烛芯像素位置 -->
      <div class="flame" id="fl0" style="left:46.41%;bottom:59.7%;">
        <div class="f-halo"></div><div class="f-outer"></div><div class="f-mid"></div><div class="f-core"></div>
      </div>
      <div class="flame" id="fl1" style="left:50.26%;bottom:59.95%;">
        <div class="f-halo"></div><div class="f-outer"></div><div class="f-mid"></div><div class="f-core"></div>
      </div>
      <div class="flame" id="fl2" style="left:54.18%;bottom:59.75%;">
        <div class="f-halo"></div><div class="f-outer"></div><div class="f-mid"></div><div class="f-core"></div>
      </div>
    </div>

    <div class="scrim-top"></div>
    <div class="blackout" id="blackout"></div>
    <canvas class="fx" id="fx"></canvas>

    <div class="crest" id="crest">
      <p class="zh">生日快乐</p>
      <p class="en">make a wish</p>
    </div>

    <section class="hud">
      <div class="hud-l">
        <p class="kicker" id="kicker">tonight</p>
        <h1 class="title" id="title">把灯关了吧</h1>
        <p class="desc" id="desc">房间暗下来，蛋糕和火才看得见。</p>
        <div class="field hidden" id="field">
          <input class="wish" id="wishIn" type="text" maxlength="24" autocomplete="off"
                 placeholder="想好了就吹，写不写都行">
        </div>
        <p class="echo hidden" id="echo"></p>
      </div>

      <div class="hud-r">
        <div class="gauge hidden" id="gauge">
          <div class="bar"><div class="bar-fill" id="barFill"></div><div class="bar-live" id="barLive"></div></div>
          <div class="gauge-txt"><span id="gaugeTxt">正在听</span><b id="gaugePct">0%</b></div>
        </div>
        <p class="tip hidden" id="tip"></p>
        <div class="row">
          <button class="btn" id="mainBtn" type="button">关灯</button>
          <button class="btn ghost hidden" id="altBtn" type="button">按住代替吹气</button>
        </div>
      </div>
    </section>

    <button class="audio-btn" id="audioBtn" type="button" aria-label="生日快乐音乐开关" title="生日快乐 · MIDI 音序">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"></path>
        <path class="wave" d="M16 9.2a4 4 0 0 1 0 5.6"></path>
        <path class="wave" d="M18.6 6.6a7.6 7.6 0 0 1 0 10.8"></path>
        <path class="off-slash" d="M19 5 L5 19"></path>
      </svg>
    </button>
  </div>
</main>

<script>
(function(){
  "use strict";

  var R = document.documentElement;
  var $ = function(id){ return document.getElementById(id); };
  var kicker=$("kicker"), title=$("title"), desc=$("desc"), field=$("field"),
      wishIn=$("wishIn"), gauge=$("gauge"), barFill=$("barFill"), barLive=$("barLive"),
      gaugeTxt=$("gaugeTxt"), gaugePct=$("gaugePct"), echo=$("echo"),
      mainBtn=$("mainBtn"), altBtn=$("altBtn"), tip=$("tip"),
      crest=$("crest"), frame=$("frame"), blackout=$("blackout"), cv=$("fx");

  var FL = [$("fl0"),$("fl1"),$("fl2")];
  /* 火焰横坐标 / 底边（%）：与底图烛芯严格对应，逐屏不变 */
  var FX = [46.41, 50.26, 54.18];
  var FY = [59.70, 59.95, 59.75];

  var S = { step:0, lit:[false,false,false], prog:0, live:0, wish:"", mic:false, manual:false };

  var SPILL = document.querySelector(".spill");
  var SCENE = document.querySelector(".scene");
  var PLATE_DAY = document.querySelector(".plate.day");
  var PLATE_NIGHT = document.querySelector(".plate.night");
  var VIGNETTE = document.querySelector(".vignette");
  var BLEED = document.querySelector(".bleed");

  function setDark(on){
    document.body.classList.toggle("dark", on);
    PLATE_DAY.style.opacity   = on ? "0" : "1";
    PLATE_NIGHT.style.opacity = on ? "1" : "0";
    VIGNETTE.style.opacity    = on ? "1" : "0";
    BLEED.style.filter = "blur(70px) brightness(" + (on ? ".16" : ".62") + ")";
  }

  function show(e){ e.classList.remove("hidden"); }
  function hide(e){ e.classList.add("hidden"); }
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

  /* ---------- 蜡烛 ---------- */
  function glow(){
    var n = S.lit.filter(Boolean).length;
    R.style.setProperty("--glow", (n/3).toFixed(3));
    SPILL.style.opacity = document.body.classList.contains("dark") ? (n/3).toFixed(3) : "0";
  }
  /* 点烛：setTimeout 主驱动 + rAF 时间轴兜底，两者幂等 */
  var litQueue = [];
  function igniteNow(i){
    if(S.lit[i]) return;
    S.lit[i]=true;
    FL[i].style.setProperty("--lit","1");
    FL[i].style.opacity="1";
    glow();
    sparkBurst(i, 14, 0.5);
  }
  function light(i, d){
    litQueue.push({i:i, at: performance.now() + d});
    setTimeout(function(){ igniteNow(i); }, d);
  }
  function pumpLitQueue(now){
    for(var k=litQueue.length-1;k>=0;k--){
      if(now >= litQueue[k].at){
        var i = litQueue[k].i;
        litQueue.splice(k,1);
        igniteNow(i);
      }
    }
  }
  function out(i){
    if(!S.lit[i]) return;
    S.lit[i]=false;
    FL[i].style.setProperty("--lit","0");
    FL[i].style.opacity="0";
    glow();
    var s=document.createElement("div");
    s.className="smoke"; s.style.left=FX[i]+"%"; s.style.bottom=FY[i]+"%";
    SCENE.appendChild(s);
    requestAnimationFrame(function(){ s.classList.add("go"); });
    setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 3400);
  }

  /* ---------- 气流 → 火苗姿态（签名交互） ---------- */
  function airflow(v){
    var w = Math.sin(Date.now()/85) * v * 9;
    R.style.setProperty("--tilt", (v*38 + w).toFixed(2)+"deg");
    R.style.setProperty("--shear", (v*16).toFixed(2));
    R.style.setProperty("--stretch", (1 + v*0.6).toFixed(3));
    R.style.setProperty("--shudder", (Math.sin(Date.now()/60)*v).toFixed(3));
  }

  /* ================= 粒子：浮尘 + 星愿 ================= */
  var g = cv.getContext("2d");
  var dust=[], spark=[];
  var dpr = Math.min(window.devicePixelRatio||1, 2);
  function fit(){
    var r = frame.getBoundingClientRect();
    cv.width  = Math.round(r.width*dpr);
    cv.height = Math.round(r.height*dpr);
    seedDust();
  }
  function seedDust(){
    dust.length=0;
    var n = Math.round(cv.width*cv.height/72000);
    for(var i=0;i<n;i++){
      dust.push({
        x:Math.random()*cv.width, y:Math.random()*cv.height,
        vx:(Math.random()-.5)*.14*dpr, vy:-(.05+Math.random()*.22)*dpr,
        r:(.5+Math.random()*1.5)*dpr, a:.12+Math.random()*.4,
        ph:Math.random()*6.28
      });
    }
  }
  window.addEventListener("resize", fit);
  fit();

  function sparkBurst(i, n, pw){
    var sr = SCENE.getBoundingClientRect(), fr = frame.getBoundingClientRect();
    var bx = (sr.left-fr.left + sr.width*(FX[i]/100))*dpr,
        by = (sr.top-fr.top + sr.height*(1-FY[i]/100))*dpr;
    for(var k=0;k<n;k++){
      spark.push({
        x:bx+(Math.random()-.5)*14*dpr, y:by+(Math.random()-.5)*9*dpr,
        vx:(Math.random()-.5)*1.0*pw*dpr, vy:-(.45+Math.random()*1.7)*pw*dpr,
        life:1, dec:.004+Math.random()*.007,
        sz:(.8+Math.random()*2.3)*dpr, hue:24+Math.random()*34
      });
    }
  }

  function render(){
    g.clearRect(0,0,cv.width,cv.height);
    var lit = S.lit.filter(Boolean).length;

    /* 浮尘：只在暗场里出现，靠近蛋糕与烛光更亮 */
    if(S.step>=1 && lit>0){
      var cx = cv.width*.503, cy = cv.height*(1-.58);
      for(var i=0;i<dust.length;i++){
        var p=dust[i];
        p.x+=p.vx + Math.sin(Date.now()/1400+p.ph)*.16*dpr;
        p.y+=p.vy;
        if(p.y<-8){ p.y=cv.height+8; p.x=Math.random()*cv.width; }
        if(p.x<-8) p.x=cv.width+8; else if(p.x>cv.width+8) p.x=-8;
        var d = Math.hypot(p.x-cx, p.y-cy)/(cv.width*.62);
        var near = Math.max(0, 1-d);
        var al = p.a * near * (lit/3) * (.65+.35*Math.sin(Date.now()/900+p.ph));
        if(al<=.012) continue;
        g.beginPath();
        g.globalAlpha = al;
        g.fillStyle = "rgb(255,"+Math.round(196+near*40)+","+Math.round(140+near*70)+")";
        g.arc(p.x,p.y,p.r,0,6.2832);
        g.fill();
      }
    }

    /* 星愿 */
    for(var j=spark.length-1;j>=0;j--){
      var s=spark[j];
      s.x+=s.vx; s.y+=s.vy;
      s.vy-=.0045*dpr; s.vx+=(Math.random()-.5)*.055*dpr;
      s.life-=s.dec;
      if(s.life<=0||s.y<-24){ spark.splice(j,1); continue; }
      g.beginPath();
      g.globalAlpha=Math.max(0,s.life)*.92;
      g.fillStyle="hsl("+s.hue+",100%,"+(64+s.life*24)+"%)";
      g.shadowBlur=11*dpr; g.shadowColor="rgba(255,178,88,.9)";
      g.arc(s.x,s.y,s.sz*s.life,0,6.2832);
      g.fill();
    }
    g.globalAlpha=1; g.shadowBlur=0;
  }

  /* ================= 麦克风 ================= */
  var ac=null, an=null, fd=null, stream=null;
  var base=0, cf=0, cs=0, ready=false;

  function band(d, lo, hi, rate, n){
    var bin=rate/n, a=Math.max(1,Math.floor(lo/bin)), b=Math.min(d.length-1,Math.ceil(hi/bin));
    var s=0,c=0; for(var i=a;i<=b;i++){s+=d[i];c++;}
    return c?s/c:0;
  }
  function micStart(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      manual("这台设备不支持麦克风采集。"); return;
    }
    navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})
    .then(function(st){
      stream=st;
      var AC=window.AudioContext||window.webkitAudioContext;
      ac=new AC(); if(ac.state==="suspended") ac.resume();
      an=ac.createAnalyser(); an.fftSize=1024; an.smoothingTimeConstant=.55;
      fd=new Uint8Array(an.frequencyBinCount);
      ac.createMediaStreamSource(st).connect(an);
      S.mic=true;
      gaugeTxt.textContent="正在校准";
      show(tip); tip.textContent="离近一点，对着麦克风缓缓送气。";
    })
    .catch(function(){ manual("没能拿到麦克风权限。"); });
  }
  function manual(why){
    S.manual=true; show(altBtn); show(tip);
    tip.textContent = why + " 按住下面的按钮，当作一口气。";
    gaugeTxt.textContent="手动";
  }
  function micRead(){
    if(!S.mic||!an) return 0;
    an.getByteFrequencyData(fd);
    var rate=ac.sampleRate;
    var lo=band(fd,40,420,rate,an.fftSize);
    var hi=band(fd,2600,7200,rate,an.fftSize);
    if(!ready){
      cs+=lo; cf++;
      if(cf>=45){ base=cs/cf; ready=true; gaugeTxt.textContent="吹"; }
      return 0;
    }
    var over=lo-base-6;
    if(over<=0) return 0;
    if(lo<hi+8) return 0;   /* 说话/音乐的高频结构更强，滤掉 */
    return clamp(over/46,0,1);
  }

  /* ================= 生日快乐（MIDI 音序 · Web Audio 合成） =================
     音符 = MIDI note number，时长 = 拍数。
     曲谱：G4 G4 A4 G4 C5 B4 / G4 G4 A4 G4 D5 C5 /
           G4 G4 G5 E5 C5 B4 A4 / F5 F5 E5 C5 D5 C5
     ==================================================================== */
  var MELODY = [
    [67,.5],[67,.5],[69,1],[67,1],[72,1],[71,2],
    [67,.5],[67,.5],[69,1],[67,1],[74,1],[72,2],
    [67,.5],[67,.5],[79,1],[76,1],[72,1],[71,1],[69,2],
    [77,.5],[77,.5],[76,1],[72,1],[74,1],[72,2]
  ];
  var BEAT = .46, LOOP_GAP = 1.7;

  var ACN=null, ACO=null, midiTimer=null, midiTime=0, midiIdx=0, musicOn=true, musicStarted=false;

  function audioCtx(){
    if(!ACN){
      var A = window.AudioContext||window.webkitAudioContext;
      if(!A) return null;
      ACN = new A();
    }
    if(ACN.state==="suspended") ACN.resume();
    if(!ACO){
      ACO = ACN.createGain();
      ACO.gain.value = 0;
      var lp = ACN.createBiquadFilter();
      lp.type="lowpass"; lp.frequency.value=5400; lp.Q.value=.4;
      ACO.connect(lp); lp.connect(ACN.destination);
    }
    return ACN;
  }

  /* 一个音：三角波主体 + 二倍频正弦泛音，做出老式 MIDI 音源的木质感 */
  function tone(when, midi, dur){
    var f = 440*Math.pow(2,(midi-69)/12);
    var g1 = ACN.createGain();
    var o1 = ACN.createOscillator(); o1.type="triangle"; o1.frequency.value=f;
    var o2 = ACN.createOscillator(); o2.type="sine";     o2.frequency.value=f*2.02;
    var g2 = ACN.createGain(); g2.gain.value=.26;
    o1.connect(g1); o2.connect(g2); g2.connect(g1); g1.connect(ACO);
    g1.gain.setValueAtTime(0, when);
    g1.gain.linearRampToValueAtTime(.85, when+.035);
    g1.gain.exponentialRampToValueAtTime(.22, when+Math.max(.14,dur*.58));
    g1.gain.exponentialRampToValueAtTime(.0015, when+dur);
    o1.start(when); o2.start(when);
    o1.stop(when+dur+.08); o2.stop(when+dur+.08);
  }

  function pumpMidi(){
    if(!ACN || !musicOn) return;
    var horizon = ACN.currentTime + .6;
    while(midiTime < horizon){
      var n = MELODY[midiIdx];
      tone(midiTime, n[0], n[1]*BEAT*.94);
      midiTime += n[1]*BEAT;
      midiIdx++;
      if(midiIdx >= MELODY.length){ midiIdx = 0; midiTime += LOOP_GAP; }
    }
  }
  function startMusic(){
    if(!musicOn) return;
    if(!audioCtx()) return;
    musicStarted = true;
    midiIdx = 0;
    midiTime = ACN.currentTime + .35;
    if(midiTimer) clearInterval(midiTimer);
    pumpMidi();
    midiTimer = setInterval(pumpMidi, 70);
    ACO.gain.cancelScheduledValues(ACN.currentTime);
    ACO.gain.setTargetAtTime(.30, ACN.currentTime, .55);
  }
  function duckMusic(v){
    if(!ACN||!ACO) return;
    ACO.gain.setTargetAtTime(v, ACN.currentTime, .8);
  }
  function stopMusic(){
    if(midiTimer){ clearInterval(midiTimer); midiTimer = null; }
    musicStarted = false;
    if(ACN && ACO) ACO.gain.setTargetAtTime(0, ACN.currentTime, .25);
  }

  var audioBtn=$("audioBtn");
  audioBtn.addEventListener("click", function(){
    musicOn = !musicOn;
    audioBtn.classList.toggle("muted", !musicOn);
    if(musicOn){
      if(S.step>=1 && S.step<3) startMusic();
    }else{
      stopMusic();
    }
  });

  /* ================= 主循环 ================= */
  var hold=false, last=performance.now();
  function loop(now){
    var dt=Math.min((now-last)/1000,.05); last=now;
    pumpLitQueue(now);

    if(S.step===2){
      /* 手动按住始终有效：与麦克风取较大值，作为兜底通道 */
      var vMic = S.mic ? micRead() : 0;
      var vHold = hold ? .85 : 0;
      var v = Math.max(vMic, vHold);
      S.live += (v-S.live)*.34;
      airflow(S.live);

      if(S.live>.26){
        S.prog += S.live*dt*1.05;
        if(Math.random()<S.live*.5){
          var li=[]; for(var i=0;i<3;i++) if(S.lit[i]) li.push(i);
          if(li.length) sparkBurst(li[(Math.random()*li.length)|0],1,.6);
        }
      }else{
        S.prog -= dt*.28;
      }
      S.prog=clamp(S.prog,0,1);

      barFill.style.width=(S.prog*100).toFixed(1)+"%";
      barLive.style.left=(S.live*100).toFixed(1)+"%";
      gaugePct.textContent=Math.round(S.prog*100)+"%";
      if(ready||S.manual){
        gaugeTxt.textContent = S.live>.55 ? "稳住" : S.live>.26 ? "有风了"
                             : S.prog>.05 ? "别停" : (S.manual?"按住":"吹");
      }

      if(S.prog>.34 && S.lit[0]) out(0);
      if(S.prog>.62 && S.lit[2]) out(2);
      if(S.prog>=1 && S.lit[1]){ out(1); done(); }
    }
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ================= 流程 ================= */
  function toWish(){
    S.step=1;
    blackout.classList.add("flash");
    setDark(true);                 /* 关灯：蛋糕在烛光里现身 */
    startMusic();                  /* 此刻已有用户手势，生日快乐 MIDI 直接响起 */
    crest.style.opacity="1";

    light(1, 900); light(0, 1180); light(2, 1450);

    kicker.textContent="your wish";
    title.textContent="许个愿";
    desc.innerHTML="写下来，或者<em>只在心里想</em>。";
    show(field);
    mainBtn.textContent="想好了";
    setTimeout(function(){ wishIn.focus(); }, 950);
  }
  function toBlow(){
    S.step=2; S.wish=wishIn.value.trim();
    hide(field); hide(mainBtn);
    kicker.textContent="one breath";
    title.textContent="对着话筒，吹";
    desc.innerHTML="风会把火苗压弯 —— <em>一口气吹到底</em>。";
    show(gauge);
    show(altBtn);
    micStart();
  }
  function done(){
    S.step=3;
    R.style.setProperty("--tilt","0deg");
    R.style.setProperty("--shear","0");
    R.style.setProperty("--stretch","1");
    R.style.setProperty("--shudder","0");
    for(var i=0;i<3;i++) sparkBurst(i,42,1.15);
    duckMusic(.08);

    if(stream){ stream.getTracks().forEach(function(t){t.stop();}); stream=null; }
    if(ac){ ac.close(); ac=null; }
    S.mic=false;

    setTimeout(function(){
      hide(gauge); hide(altBtn); hide(tip);
      kicker.textContent="it's done";
      title.textContent="灭了";
      desc.textContent = S.wish ? "这句话只有蜡烛听见了。" : "没说出口的那句，也算数。";
      if(S.wish){ echo.textContent=S.wish; show(echo); }
      mainBtn.textContent="再来一次";
      show(mainBtn);
    }, 1250);
  }
  function reset(){
    S.step=0; S.prog=0; S.live=0; S.manual=false; S.lit=[false,false,false];
    ready=false; cf=0; cs=0; base=0; spark.length=0; litQueue.length=0;
    blackout.classList.remove("flash");
    setDark(false);
    stopMusic();
    FL.forEach(function(f){ f.style.setProperty("--lit","0"); f.style.opacity="0"; });
    glow();
    R.style.setProperty("--tilt","0deg");
    R.style.setProperty("--shear","0");
    R.style.setProperty("--stretch","1");
    R.style.setProperty("--shudder","0");
    crest.style.opacity="1";
    wishIn.value="";
    barFill.style.width="0%"; barLive.style.left="0%"; gaugePct.textContent="0%";
    hide(echo); hide(gauge); hide(field); hide(altBtn); hide(tip);
    kicker.textContent="tonight";
    title.textContent="把灯关了吧";
    desc.textContent="房间暗下来，蛋糕和火才看得见。";
    mainBtn.textContent="关灯"; show(mainBtn);
  }

  mainBtn.addEventListener("click", function(){
    if(S.step===0) toWish();
    else if(S.step===1) toBlow();
    else if(S.step===3) reset();
  });
  wishIn.addEventListener("keydown", function(e){
    if(e.key==="Enter" && S.step===1) toBlow();
  });

  /* 大屏/遥控器：空格或回车直接推进流程（输入框内不拦） */
  window.addEventListener("keydown", function(e){
    if(e.target===wishIn) return;
    if(e.key===" "||e.key==="Enter"){
      if(S.step===0||S.step===1||S.step===3){ e.preventDefault(); mainBtn.click(); }
    }
  });

  function on(e){ e.preventDefault(); hold=true; }
  function off(){ hold=false; }
  altBtn.addEventListener("mousedown",on);
  altBtn.addEventListener("touchstart",on,{passive:false});
  window.addEventListener("mouseup",off);
  window.addEventListener("touchend",off);
  altBtn.addEventListener("keydown",function(e){
    if(e.key===" "||e.key==="Enter"){ e.preventDefault(); hold=true; }
  });
  altBtn.addEventListener("keyup",off);

  setInterval(function(){
    if(S.step===2 && S.mic && ready && S.prog<.02 && !S.manual && altBtn.classList.contains("hidden")){
      show(altBtn); show(tip);
      tip.textContent="吹不动？按住这个按钮也行。";
    }
  }, 9000);

})();
</script>
</body>
</html>
