<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>关灯・许愿・吹蜡烛</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@200;300;400&display=swap">
<style>
@property --lit{syntax:"<number>";inherits:false;initial-value:0;}
@property --stretch{syntax:"<number>";inherits:true;initial-value:1;}
@property --shear{syntax:"<number>";inherits:true;initial-value:0;}
@property --tilt{syntax:"<angle>";inherits:true;initial-value:0deg;}
/* ================================================================
   视觉方向
   世界    夜里熄了灯的房间，一张脸被三簇火苗照亮
   材质    奶油、蜡、烟、空气里的浮尘
   配色    午夜靛蓝 #0a0a1f / 烛焰橙 #ff8c26 / 焰心 #fff6d8
   签名    气流实时把火苗吹弯——风力越大歪得越狠，撤气就弹回来
   ================================================================ */
:root{
  --ink:#07060f;
  --wax:#f6efe2;
  --f-out:#ff7a1a;
  --f-mid:#ffb545;
  --f-core:#fff8e0;
  --mint:#7fe3c4;
  --day: url("https://aka.doubaocdn.com/s/1EvjUfgcEn");
  --night: url("https://aka.doubaocdn.com/s/HT4LYQVLv6");
  --f-disp:"Noto Serif SC","Songti SC",serif;
  --f-hand:"Ma Shan Zheng","Kaiti SC",cursive;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB",sans-serif;
  --dark:0;      /* 关灯进度 */
  --glow:0;      /* 烛光总量 */
  --tilt:0deg;   /* 气流偏角 */
  --shear:0;     /* 气流剪切 */
  --stretch:1;
  --shudder:0;   /* 全局风感 */
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;overflow:hidden;}
body{
  background:var(--ink);
  font-family:var(--f-body);
  color:var(--wax);
  -webkit-font-smoothing:antialiased;
}

/* ===== 舞台 ===== */
.stage{
  position:fixed;inset:0;
  display:grid;place-items:center;
  perspective:1200px;
}
.frame{
  position:relative;
  height:100dvh;aspect-ratio:1536/2048;max-width:100vw;
  transform:translateX(calc(var(--shudder) * 2px));
}
/* 两张底图叠放，交叉淡入 —— 关灯不是滤镜 */
.plate{
  position:absolute;inset:0;
  background-size:cover;background-position:center;
}
.plate.day{
  background-image:var(--day);
  opacity:1;
  transition:opacity 1.15s cubic-bezier(.7,0,.3,1);
}
.plate.night{
  background-image:var(--night);
  opacity:0;
  transition:opacity 1.15s cubic-bezier(.7,0,.3,1);
}
body.dark .plate.day{opacity:0;}
body.dark .plate.night{opacity:1;}
/* 关灯瞬间的一记全黑，吃掉两图的细微位移 */
.blackout{
  position:absolute;inset:0;background:#000;
  opacity:0;pointer-events:none;
}
.blackout.flash{animation:blackout-flash 1.15s ease-in-out;}
@keyframes blackout-flash{
  0%{opacity:0;}
  38%{opacity:1;}
  62%{opacity:1;}
  100%{opacity:0;}
}
/* 两侧灰边补齐：同图放大铺底 */
.bleed{
  position:fixed;inset:-10%;z-index:-1;
  background-image:var(--night);
  background-size:cover;background-position:center;
  filter:blur(60px) brightness(.72);
  transition:filter 1.15s ease;
}
body.dark .bleed{filter:blur(60px) brightness(.22);}
/* 烛光在环境里的溢出 */
.spill{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 30% 17% at 50% 31%, rgba(255,178,86,.85) 0%, rgba(255,140,40,.32) 40%, rgba(255,120,30,0) 72%),
    radial-gradient(ellipse 62% 40% at 50% 44%, rgba(255,150,60,.30) 0%, rgba(255,120,40,0) 70%);
  mix-blend-mode:screen;
  opacity:0;
  transition:opacity .45s ease;
}
/* 暗角 */
.vignette{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 70% 55% at 50% 44%, transparent 30%, rgba(4,3,12,.62) 78%, rgba(3,2,9,.92) 100%);
  opacity:0;
  transition:opacity 1.15s ease;
}
body.dark .vignette{opacity:1;}

/* ================================================================
   火焰 —— 主角，多层叠加
   ================================================================ */
.flame{
  --lit:0;
  position:absolute;
  width:2.9%;
  padding-bottom:7.1%;
  height:0;
  transform:translateX(-50%) rotate(var(--tilt)) skewX(calc(var(--shear) * 1deg)) scaleY(calc(var(--lit) * var(--stretch)));
  transform-origin:50% 100%;
  opacity:var(--lit);
  transition:opacity .3s ease, transform .1s linear;
  will-change:transform;
}
.flame > *{position:absolute;}
/* 外焰 */
.f-outer{
  position:absolute;inset:0;
  background:radial-gradient(ellipse 60% 50% at 50% 78%,
      var(--f-out) 0%, rgba(255,110,20,.72) 45%, rgba(255,90,10,0) 78%);
  border-radius:50% 50% 45% 45% / 66% 66% 34% 34%;
  clip-path:polygon(50% 0%,68% 22%,84% 52%,78% 80%,50% 100%,22% 80%,16% 52%,32% 22%);
  filter:blur(1.1px);
  animation:dance 1.45s ease-in-out infinite;
}
/* 中焰 */
.f-mid{
  position:absolute;left:50%;bottom:0;
  width:70%;height:78%;transform:translateX(-50%);
  background:linear-gradient(to top,
      rgba(255,120,20,.9) 0%, var(--f-mid) 42%, rgba(255,220,150,.95) 82%, rgba(255,248,224,1) 100%);
  border-radius:50% 50% 44% 44% / 64% 64% 36% 36%;
  clip-path:polygon(50% 0%,70% 26%,82% 56%,74% 82%,50% 100%,26% 82%,18% 56%,30% 26%);
  filter:blur(.3px);
  animation:dance 1.15s ease-in-out infinite reverse;
}
/* 焰心 + 底部蓝焰 */
.f-core{
  position:absolute;left:50%;bottom:2%;
  width:38%;height:46%;transform:translateX(-50%);
  background:linear-gradient(to top,
      rgba(90,150,255,.85) 0%, rgba(180,210,255,.7) 26%, var(--f-core) 62%, #fff 100%);
  border-radius:50% 50% 42% 42% / 60% 60% 40% 40%;
  filter:blur(.5px);
  animation:dance .82s ease-in-out infinite;
}
/* 光晕 */
.f-halo{
  position:absolute;left:50%;top:34%;
  width:620%;aspect-ratio:1;transform:translate(-50%,-50%);
  background:radial-gradient(circle,
      rgba(255,196,110,.5) 0%, rgba(255,150,55,.2) 30%, rgba(255,130,40,0) 66%);
  animation:breathe 2.4s ease-in-out infinite;
  pointer-events:none;
}
@keyframes dance{
  0%,100%{transform:translateX(-50%) scaleX(1)   scaleY(1);}
  20%    {transform:translateX(-47%) scaleX(.9)  scaleY(1.1);}
  45%    {transform:translateX(-53%) scaleX(1.08) scaleY(.93);}
  70%    {transform:translateX(-49%) scaleX(.95) scaleY(1.05);}
}
.f-outer{animation-name:dance-o;}
@keyframes dance-o{
  0%,100%{transform:scaleX(1) scaleY(1);}
  25%{transform:scaleX(.88) scaleY(1.12) translateX(3%);}
  55%{transform:scaleX(1.1) scaleY(.9) translateX(-3%);}
  80%{transform:scaleX(.94) scaleY(1.06) translateX(1%);}
}
@keyframes breathe{
  0%,100%{opacity:.8;transform:translate(-50%,-50%) scale(1);}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.16);}
}

/* 青烟 */
.smoke{
  position:absolute;width:1.5%;aspect-ratio:1;transform:translateX(-50%);
  border-radius:50%;
  background:radial-gradient(circle, rgba(226,222,238,.46), rgba(200,198,220,0) 70%);
  opacity:0;pointer-events:none;
}
.smoke.go{animation:rise 3.2s ease-out forwards;}
@keyframes rise{
  0%{opacity:0;transform:translate(-50%,0) scale(.4);}
  16%{opacity:.72;}
  100%{opacity:0;transform:translate(calc(-50% + 30px),-210px) scale(3.8);}
}

.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}

/* ================================================================
   UI
   ================================================================ */
.hud{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);
  z-index:6;width:min(520px,100vw);
  padding:60px clamp(22px,5vw,34px) calc(30px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:15px;align-items:center;text-align:center;
  background:linear-gradient(to top, rgba(5,4,12,.9) 0%, rgba(5,4,12,.62) 46%, rgba(5,4,12,0) 100%);
}
.kicker{
  margin:0;font-size:10px;font-weight:300;
  letter-spacing:.62em;text-indent:.62em;
  color:rgba(246,239,226,.42);text-transform:uppercase;
}
.title{
  margin:0;font-family:var(--f-disp);font-weight:600;
  font-size:clamp(25px,5.6vw,33px);letter-spacing:.1em;
  text-shadow:0 0 34px rgba(255,160,70,.34);
}
.desc{
  margin:0;font-size:13.5px;line-height:1.75;font-weight:200;
  color:rgba(246,239,226,.6);max-width:32em;
}
.desc em{font-style:normal;color:var(--mint);font-weight:400;}

.btn{
  font:500 14px/1 var(--f-body);letter-spacing:.2em;text-indent:.2em;
  color:#1a1526;background:linear-gradient(to bottom,#fff8ec,#ffdfb4);
  border:none;border-radius:999px;padding:15px 44px;min-height:48px;cursor:pointer;
  box-shadow:0 8px 30px rgba(255,168,80,.26), inset 0 -2px 0 rgba(0,0,0,.09);
  transition:transform .18s, box-shadow .18s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 13px 38px rgba(255,168,80,.4);}
.btn:active{transform:translateY(0);}
.btn:focus-visible{outline:2px solid var(--mint);outline-offset:3px;}
.btn.ghost{
  background:none;color:rgba(246,239,226,.6);
  border:1px solid rgba(246,239,226,.24);box-shadow:none;
  padding:12px 26px;font-size:12.5px;min-height:44px;
}
.btn.ghost:hover{color:var(--wax);transform:none;box-shadow:none;}

.field{width:100%;}
.wish{
  width:100%;font-family:var(--f-hand);font-size:23px;line-height:1.6;
  text-align:center;color:var(--wax);
  background:rgba(246,239,226,.05);
  border:none;border-bottom:1px solid rgba(246,239,226,.2);
  border-radius:10px 10px 0 0;padding:15px;
}
.wish::placeholder{color:rgba(246,239,226,.26);font-size:20px;}
.wish:focus{outline:none;border-bottom-color:var(--mint);background:rgba(246,239,226,.09);}

/* 风力计 —— 签名交互的读数 */
.gauge{width:100%;max-width:330px;display:flex;flex-direction:column;gap:8px;}
.bar{position:relative;height:5px;border-radius:99px;background:rgba(246,239,226,.13);overflow:hidden;}
.bar-fill{
  position:absolute;inset:0 auto 0 0;width:0%;border-radius:99px;
  background:linear-gradient(90deg,var(--mint),var(--f-mid),var(--f-out));
  transition:width .1s linear;
}
.bar-live{
  position:absolute;top:-4px;bottom:-4px;left:0;width:2px;border-radius:2px;
  background:#fff;box-shadow:0 0 10px rgba(255,255,255,.8);
  transition:left .07s linear;
}
.gauge-txt{
  display:flex;justify-content:space-between;
  font-size:10.5px;letter-spacing:.2em;color:rgba(246,239,226,.4);
}
.gauge-txt b{font-weight:400;font-variant-numeric:tabular-nums;}

.echo{
  margin:0;font-family:var(--f-hand);
  font-size:clamp(26px,6.4vw,36px);line-height:1.5;
  text-shadow:0 0 36px rgba(255,196,116,.44);word-break:break-word;
}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
.tip{margin:0;font-size:11.5px;line-height:1.6;color:rgba(246,239,226,.36);}
.hidden{display:none!important;}

/* 顶部题字 */
.crest{
  position:fixed;top:calc(26px + env(safe-area-inset-top));left:50%;
  transform:translateX(-50%);z-index:6;text-align:center;
  transition:opacity .9s ease;
}
.crest p{margin:0;}
.crest .zh{
  font-family:var(--f-disp);font-weight:900;
  font-size:clamp(20px,4.8vw,26px);letter-spacing:.42em;text-indent:.42em;
  color:rgba(246,239,226,.92);
}
.crest .en{
  margin-top:7px;font-size:9px;letter-spacing:.56em;text-indent:.56em;
  color:rgba(246,239,226,.36);text-transform:uppercase;
}
.crest .bless{
  margin:0 0 8px;
  font-family:var(--f-hand);
  font-size:clamp(32px,7.4vw,44px);
  letter-spacing:.22em;text-indent:.22em;
  color:#ffd996;
  text-shadow:0 0 34px rgba(255,170,80,.75), 0 0 12px rgba(255,200,120,.45);
}

/* ================================================================
   终场：黑幕 + 玩具礼物迸发 + 音效
   ================================================================ */
.curtain{
  position:fixed;inset:0;z-index:20;
  background:#000;
  opacity:0;pointer-events:none;
  transition:opacity .55s ease;
}
.curtain.on{opacity:1;pointer-events:auto;}

.party{
  position:fixed;inset:0;z-index:21;
  pointer-events:none;overflow:hidden;
  opacity:0;
}
.party.on{opacity:1;}
/* 终场底光，让黑幕不死板 */
.party::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(ellipse 60% 45% at 50% 58%, rgba(255,176,92,.20) 0%, rgba(255,140,50,0) 70%),
    radial-gradient(ellipse 90% 60% at 50% 100%, rgba(120,90,200,.18) 0%, rgba(80,60,160,0) 72%);
  opacity:0;transition:opacity 1.1s ease .25s;
}
.party.on::before{opacity:1;}

.toy{
  position:absolute;
  left:50%;top:58%;
  width:var(--sz);
  transform:translate(-50%,-50%);
  will-change:transform;
  filter:drop-shadow(0 14px 26px rgba(0,0,0,.55));
}
.toy img{width:100%;height:auto;display:block;}

/* 终场文案 */
.finale{
  position:fixed;left:50%;top:50%;
  transform:translate(-50%,-50%);
  z-index:23;text-align:center;
  width:min(560px,90vw);
  pointer-events:none;
  opacity:0;
}
.finale.on{opacity:1;transition:opacity 1s ease;}
/* 文字后的柔光，保证压在玩具之上仍清晰 */
.finale::before{
  content:"";position:absolute;left:50%;top:50%;
  width:150%;height:190%;transform:translate(-50%,-50%);
  background:radial-gradient(ellipse at center, rgba(6,4,14,.82) 0%, rgba(6,4,14,.55) 45%, rgba(6,4,14,0) 72%);
  z-index:-1;
}
.finale .big{
  margin:0;font-family:var(--f-disp);font-weight:900;
  font-size:clamp(34px,9vw,62px);letter-spacing:.16em;text-indent:.16em;
  color:#fff8ec;
  text-shadow:0 0 46px rgba(255,180,90,.7), 0 0 90px rgba(255,140,60,.4);
}
.finale .big-bless{
  margin:0 0 8px;
  font-family:var(--f-hand);
  font-size:clamp(28px,6.8vw,42px);
  letter-spacing:.22em;text-indent:.22em;
  color:#ffd996;
  text-shadow:0 0 32px rgba(255,170,80,.75), 0 0 10px rgba(255,200,120,.45);
}
.finale .wishtext{
  margin:18px 0 0;font-family:var(--f-hand);
  font-size:clamp(22px,5.4vw,32px);line-height:1.5;
  color:rgba(255,246,232,.9);
  text-shadow:0 0 30px rgba(255,190,110,.5);
  word-break:break-word;
}
.finale .again{
  margin-top:30px;pointer-events:auto;
  display:inline-block;
}

@media (prefers-reduced-motion:reduce){
  .f-outer,.f-mid,.f-core,.f-halo,.toy{animation:none;}
  *{transition-duration:.01ms!important;}
}

/* 音乐开关 */
.audio-btn{
  position:fixed;right:18px;top:calc(18px + env(safe-area-inset-top));
  z-index:30;
  width:38px;height:38px;border-radius:50%;
  border:1px solid rgba(246,239,226,.2);
  background:rgba(10,8,20,.5);
  color:rgba(246,239,226,.7);
  display:grid;place-items:center;cursor:pointer;
  transition:color .2s, border-color .2s, background .2s;
}
.audio-btn:hover{color:#fff;border-color:rgba(246,239,226,.45);}
.audio-btn:focus-visible{outline:2px solid var(--mint);outline-offset:2px;}
.audio-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;}
.audio-btn .off-slash{opacity:0;}
.audio-btn.muted .off-slash{opacity:1;}
.audio-btn.muted .wave{opacity:0;}

@media (max-height:660px){
  .hud{padding-top:34px;gap:11px;}
  .title{font-size:21px;}
  .wish{font-size:19px;padding:11px;}
}
</style>
</head>
<body>

<div class="bleed"></div>

<main class="stage">
  <div class="frame" id="frame">
    <div class="plate day"></div>
    <div class="plate night"></div>
    <div class="vignette"></div>
    <div class="spill"></div>
    <div class="blackout" id="blackout"></div>

    <!-- 火焰：坐标取自暗场底图的烛芯像素位置 -->
    <div class="flame" id="fl0" style="left:37.19%;bottom:66.9%;">
      <div class="f-halo"></div><div class="f-outer"></div><div class="f-mid"></div><div class="f-core"></div>
    </div>
    <div class="flame" id="fl1" style="left:50.70%;bottom:66.85%;">
      <div class="f-halo"></div><div class="f-outer"></div><div class="f-mid"></div><div class="f-core"></div>
    </div>
    <div class="flame" id="fl2" style="left:63.67%;bottom:66.8%;">
      <div class="f-halo"></div><div class="f-outer"></div><div class="f-mid"></div><div class="f-core"></div>
    </div>

    <canvas class="fx" id="fx"></canvas>
  </div>
</main>

<div class="crest" id="crest">
  <p class="bless" id="blessLine"></p>
  <p class="zh">生日快乐</p>
  <p class="en">make a wish</p>
</div>

<section class="hud">
  <p class="kicker" id="kicker">tonight</p>
  <h1 class="title" id="title">把灯关了吧</h1>
  <p class="desc" id="desc">房间暗下来，火才看得见。</p>

  <div class="field hidden" id="field">
    <input class="wish" id="wishIn" type="text" maxlength="24" autocomplete="off"
           placeholder="想好了就吹，写不写都行">
  </div>

  <div class="gauge hidden" id="gauge">
    <div class="bar"><div class="bar-fill" id="barFill"></div><div class="bar-live" id="barLive"></div></div>
    <div class="gauge-txt"><span id="gaugeTxt">正在听</span><b id="gaugePct">0%</b></div>
  </div>

  <p class="echo hidden" id="echo"></p>

  <div class="row">
    <button class="btn" id="mainBtn" type="button">关灯</button>
    <button class="btn ghost hidden" id="altBtn" type="button">按住代替吹气</button>
  </div>

  <p class="tip hidden" id="tip"></p>
</section>

<!-- ===== 终场 ===== -->
<div class="curtain" id="curtain"></div>
<div class="party" id="party"></div>
<div class="finale" id="finale">
  <p class="big-bless" id="finaleBless"></p>
  <p class="big">生日快乐</p>
  <p class="wishtext" id="finaleWish"></p>
  <div class="again"><button class="btn" id="againBtn" type="button">再来一次</button></div>
</div>

<button class="audio-btn" id="audioBtn" type="button" aria-label="背景音乐开关" title="背景音乐">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"></path>
    <path class="wave" d="M16 9.2a4 4 0 0 1 0 5.6"></path>
    <path class="wave" d="M18.6 6.6a7.6 7.6 0 0 1 0 10.8"></path>
    <path class="off-slash" d="M19 5 L5 19"></path>
  </svg>
</button>

<audio id="bgm" loop preload="auto" src="https://aka.doubaocdn.com/s/pd3CfrJwgf"></audio>
<audio id="sfx" preload="auto" src="https://aka.doubaocdn.com/s/2cxQXD6wfd"></audio>

<script>
(function(){
  "use strict";

  var R = document.documentElement;

  /* ★ 寿星姓名：生成页面时把引号内改为实际姓名，
       首页「生日快乐」上方会显示「祝 + 姓名」 */
  var BIRTH_NAME="付鑫鑫";
  var $ = function(id){ return document.getElementById(id); };
  var kicker=$("kicker"), title=$("title"), desc=$("desc"), field=$("field"),
      wishIn=$("wishIn"), gauge=$("gauge"), barFill=$("barFill"), barLive=$("barLive"),
      gaugeTxt=$("gaugeTxt"), gaugePct=$("gaugePct"), echo=$("echo"),
      mainBtn=$("mainBtn"), altBtn=$("altBtn"), tip=$("tip"),
      crest=$("crest"), frame=$("frame"), blackout=$("blackout"), cv=$("fx"),
      blessLine=$("blessLine"), curtain=$("curtain"), party=$("party"),
      finale=$("finale"), finaleWish=$("finaleWish"), finaleBless=$("finaleBless"), againBtn=$("againBtn");

  var FL = [$("fl0"),$("fl1"),$("fl2")];
  var FX = [37.19, 50.70, 63.67];
  var FY = [66.90, 66.85, 66.80];

  if(BIRTH_NAME){
    blessLine.textContent="祝"+BIRTH_NAME;
    finaleBless.textContent="祝"+BIRTH_NAME;
  }
  else{
    blessLine.style.display="none";
    finaleBless.style.display="none";
  }

  var S = { step:0, lit:[false,false,false], prog:0, live:0, wish:"", mic:false, manual:false };

  var SPILL = document.querySelector(".spill");
  var PLATE_DAY = document.querySelector(".plate.day");
  var PLATE_NIGHT = document.querySelector(".plate.night");
  var VIGNETTE = document.querySelector(".vignette");
  var BLEED = document.querySelector(".bleed");

  function setDark(on){
    document.body.classList.toggle("dark", on);
    PLATE_DAY.style.opacity   = on ? "0" : "1";
    PLATE_NIGHT.style.opacity = on ? "1" : "0";
    VIGNETTE.style.opacity    = on ? "1" : "0";
    BLEED.style.filter = "blur(60px) brightness(" + (on ? ".22" : ".72") + ")";
  }

  function show(e){ e.classList.remove("hidden"); }
  function hide(e){ e.classList.add("hidden"); }
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

  /* ---------- 蜡烛 ---------- */
  function glow(){
    var n = S.lit.filter(Boolean).length;
    R.style.setProperty("--glow", (n/3).toFixed(3));
    SPILL.style.opacity = document.body.classList.contains("dark") ? (n/3).toFixed(3) : "0";
  }
  /* 点烛：setTimeout 主驱动 + rAF 时间轴兜底，两者幂等 */
  var litQueue = [];
  function igniteNow(i){
    if(S.lit[i]) return;
    S.lit[i]=true;
    FL[i].style.setProperty("--lit","1");
    FL[i].style.opacity="1";
    glow();
    sparkBurst(i, 12, 0.5);
  }
  function light(i, d){
    litQueue.push({i:i, at: performance.now() + d});
    setTimeout(function(){ igniteNow(i); }, d);
  }
  function pumpLitQueue(now){
    for(var k=litQueue.length-1;k>=0;k--){
      if(now >= litQueue[k].at){
        var i = litQueue[k].i;
        litQueue.splice(k,1);
        igniteNow(i);
      }
    }
  }
  function out(i){
    if(!S.lit[i]) return;
    S.lit[i]=false;
    FL[i].style.setProperty("--lit","0");
    FL[i].style.opacity="0";
    glow();
    var s=document.createElement("div");
    s.className="smoke"; s.style.left=FX[i]+"%"; s.style.bottom=FY[i]+"%";
    frame.appendChild(s);
    requestAnimationFrame(function(){ s.classList.add("go"); });
    setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 3400);
  }

  /* ---------- 气流 → 火苗姿态（签名交互） ---------- */
  function airflow(v){
    var w = Math.sin(Date.now()/85) * v * 9;
    R.style.setProperty("--tilt", (v*38 + w).toFixed(2)+"deg");
    R.style.setProperty("--shear", (v*16).toFixed(2));
    R.style.setProperty("--stretch", (1 + v*0.6).toFixed(3));
    R.style.setProperty("--shudder", (Math.sin(Date.now()/60)*v).toFixed(3));
  }

  /* ================= 粒子：浮尘 + 星愿 ================= */
  var g = cv.getContext("2d");
  var dust=[], spark=[];
  var dpr = Math.min(window.devicePixelRatio||1, 2);
  function fit(){
    var r = frame.getBoundingClientRect();
    cv.width  = Math.round(r.width*dpr);
    cv.height = Math.round(r.height*dpr);
    seedDust();
  }
  function seedDust(){
    dust.length=0;
    var n = Math.round(cv.width*cv.height/72000);
    for(var i=0;i<n;i++){
      dust.push({
        x:Math.random()*cv.width, y:Math.random()*cv.height,
        vx:(Math.random()-.5)*.14*dpr, vy:-(.05+Math.random()*.22)*dpr,
        r:(.5+Math.random()*1.5)*dpr, a:.12+Math.random()*.4,
        ph:Math.random()*6.28
      });
    }
  }
  window.addEventListener("resize", fit);
  fit();

  function sparkBurst(i, n, pw){
    var r = frame.getBoundingClientRect();
    var bx = r.width*(FX[i]/100)*dpr, by = r.height*(1-FY[i]/100)*dpr;
    for(var k=0;k<n;k++){
      spark.push({
        x:bx+(Math.random()-.5)*14*dpr, y:by+(Math.random()-.5)*9*dpr,
        vx:(Math.random()-.5)*1.0*pw*dpr, vy:-(.45+Math.random()*1.7)*pw*dpr,
        life:1, dec:.004+Math.random()*.007,
        sz:(.8+Math.random()*2.3)*dpr, hue:24+Math.random()*34
      });
    }
  }

  function render(){
    g.clearRect(0,0,cv.width,cv.height);
    var lit = S.lit.filter(Boolean).length;

    /* 浮尘：只在暗场里出现，靠近烛光更亮 */
    if(S.step>=1 && lit>0){
      var cx = cv.width*.5, cy = cv.height*(1-.665);
      for(var i=0;i<dust.length;i++){
        var p=dust[i];
        p.x+=p.vx + Math.sin(Date.now()/1400+p.ph)*.16*dpr;
        p.y+=p.vy;
        if(p.y<-8){ p.y=cv.height+8; p.x=Math.random()*cv.width; }
        if(p.x<-8) p.x=cv.width+8; else if(p.x>cv.width+8) p.x=-8;
        var d = Math.hypot(p.x-cx, p.y-cy)/(cv.width*.62);
        var near = Math.max(0, 1-d);
        var al = p.a * near * (lit/3) * (.65+.35*Math.sin(Date.now()/900+p.ph));
        if(al<=.012) continue;
        g.beginPath();
        g.globalAlpha = al;
        g.fillStyle = "rgb(255,"+Math.round(196+near*40)+","+Math.round(140+near*70)+")";
        g.arc(p.x,p.y,p.r,0,6.2832);
        g.fill();
      }
    }

    /* 星愿 */
    for(var j=spark.length-1;j>=0;j--){
      var s=spark[j];
      s.x+=s.vx; s.y+=s.vy;
      s.vy-=.0045*dpr; s.vx+=(Math.random()-.5)*.055*dpr;
      s.life-=s.dec;
      if(s.life<=0||s.y<-24){ spark.splice(j,1); continue; }
      g.beginPath();
      g.globalAlpha=Math.max(0,s.life)*.92;
      g.fillStyle="hsl("+s.hue+",100%,"+(64+s.life*24)+"%)";
      g.shadowBlur=11*dpr; g.shadowColor="rgba(255,178,88,.9)";
      g.arc(s.x,s.y,s.sz*s.life,0,6.2832);
      g.fill();
    }
    g.globalAlpha=1; g.shadowBlur=0;
  }

  /* ================= 麦克风 ================= */
  var ac=null, an=null, fd=null, stream=null;
  var base=0, baseMid=0, baseHi=0, cf=0, cs=0, cm=0, ch=0, ready=false;

  function band(d, lo, hi, rate, n){
    var bin=rate/n, a=Math.max(1,Math.floor(lo/bin)), b=Math.min(d.length-1,Math.ceil(hi/bin));
    var s=0,c=0; for(var i=a;i<=b;i++){s+=d[i];c++;}
    return c?s/c:0;
  }
  function micStart(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      manual("这台设备不支持麦克风采集。"); return;
    }
    navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:true}})
    .then(function(st){
      stream=st;
      var AC=window.AudioContext||window.webkitAudioContext;
      ac=new AC(); if(ac.state==="suspended") ac.resume();
      an=ac.createAnalyser(); an.fftSize=1024; an.smoothingTimeConstant=.55;
      fd=new Uint8Array(an.frequencyBinCount);
      ac.createMediaStreamSource(st).connect(an);
      S.mic=true;
      gaugeTxt.textContent="正在校准";
      show(tip); tip.textContent="离近一点，对着麦克风缓缓送气。";
    })
    .catch(function(){ manual("没能拿到麦克风权限。"); });
  }
  function manual(why){
    S.manual=true; show(altBtn); show(tip);
    tip.textContent = why + " 按住下面的按钮，当作一口气。";
    gaugeTxt.textContent="手动";
  }
  function micRead(){
    if(!S.mic||!an) return 0;
    an.getByteFrequencyData(fd);
    var rate=ac.sampleRate;
    /* 三个频段：低频 40–420（吹气主体）、中频 420–2400、高频 2400–7600 */
    var lo=band(fd,40,420,rate,an.fftSize);
    var mid=band(fd,420,2400,rate,an.fftSize);
    var hi=band(fd,2400,7600,rate,an.fftSize);
    if(!ready){
      cs+=lo; cm+=mid; ch+=hi; cf++;
      if(cf>=45){
        base=cs/cf; baseMid=cm/cf; baseHi=ch/cf;
        ready=true; gaugeTxt.textContent="吹";
      }
      return 0;
    }
    var over=lo-base-6;
    if(over<=0) return 0;
    /* 吹气是宽带噪声：中频/高频会随低频一起抬升；
       说话时频谱能量集中在低频段、高频抬升很小。
       用「中频或高频同步抬升」确认吹气，替代旧版 lo<hi+8 的一刀切误杀。 */
    var midOver=mid-baseMid;
    var hiOver=hi-baseHi;
    if(midOver<1 && hiOver<1) return 0;
    return clamp((over*0.85+Math.max(midOver,hiOver)*0.15)/42,0,1);
  }

  /* ================= 主循环 ================= */
  var hold=false, last=performance.now();
  function loop(now){
    var dt=Math.min((now-last)/1000,.05); last=now;
    pumpLitQueue(now);

    if(S.step===2){
      /* 手动按住始终有效：与麦克风取较大值，作为兜底通道 */
      var vMic = S.mic ? micRead() : 0;
      var vHold = hold ? .85 : 0;
      var v = Math.max(vMic, vHold);
      S.live += (v-S.live)*.34;
      airflow(S.live);

      if(S.live>.26){
        S.prog += S.live*dt*1.05;
        if(Math.random()<S.live*.5){
          var li=[]; for(var i=0;i<3;i++) if(S.lit[i]) li.push(i);
          if(li.length) sparkBurst(li[(Math.random()*li.length)|0],1,.6);
        }
      }else{
        S.prog -= dt*.28;
      }
      S.prog=clamp(S.prog,0,1);

      barFill.style.width=(S.prog*100).toFixed(1)+"%";
      barLive.style.left=(S.live*100).toFixed(1)+"%";
      gaugePct.textContent=Math.round(S.prog*100)+"%";
      if(ready||S.manual){
        gaugeTxt.textContent = S.live>.55 ? "稳住" : S.live>.26 ? "有风了"
                             : S.prog>.05 ? "别停" : (S.manual?"按住":"吹");
      }

      if(S.prog>.34 && S.lit[0]) out(0);
      if(S.prog>.62 && S.lit[2]) out(2);
      if(S.prog>=1 && S.lit[1]){ out(1); done(); }
    }
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ---------- 音频 ---------- */
  var bgm=$("bgm"), sfx=$("sfx"), audioBtn=$("audioBtn");
  var musicOn=true;
  function tryPlayBGM(){
    if(!musicOn) return;
    bgm.volume=0;
    var p=bgm.play();
    if(p && p.catch) p.catch(function(){});
    /* 淡入 */
    var t0=performance.now();
    (function fade(){
      var k=Math.min((performance.now()-t0)/1600,1);
      bgm.volume=k*0.55;
      if(k<1) requestAnimationFrame(fade);
    })();
  }
  audioBtn.addEventListener("click", function(){
    musicOn=!musicOn;
    audioBtn.classList.toggle("muted", !musicOn);
    if(musicOn){ tryPlayBGM(); }
    else { bgm.pause(); }
  });

  /* ================================================================
     终场：黑幕 + 玩具礼物迸发 + 音效
     ================================================================ */
  var TOYS = [
    "https://aka.doubaocdn.com/s/WeMdfk6swN",
    "https://aka.doubaocdn.com/s/HGCsnhgVM8",
    "https://aka.doubaocdn.com/s/9bCKsyBhrE",
    "https://aka.doubaocdn.com/s/B2bBoq51vV",
    "https://aka.doubaocdn.com/s/nVBs8yr8cd",
    "https://aka.doubaocdn.com/s/OIXzmhQabT",
    "https://aka.doubaocdn.com/s/OjPEPwOThi",
    "https://aka.doubaocdn.com/s/kySmVU8WD3"
  ];
  /* 预载，避免迸发时才开始下载 */
  TOYS.forEach(function(u){ var im=new Image(); im.src=u; });

  var toyBodies=[], toyRAF=null;

  function spawnToys(){
    party.innerHTML="";
    toyBodies.length=0;
    var W=window.innerWidth, H=window.innerHeight;
    /* 每件玩具来三个，共 24 件，铺满画面 */
    var plan=[];
    for(var pass=0; pass<3; pass++){
      TOYS.forEach(function(u){ plan.push(u); });
    }
    /* 打散顺序，避免同款相邻 */
    for(var s=plan.length-1;s>0;s--){
      var j=(Math.random()*(s+1))|0; var tmp=plan[s]; plan[s]=plan[j]; plan[j]=tmp;
    }

    plan.forEach(function(src, k){
      var el=document.createElement("div");
      el.className="toy";
      var size = 78 + Math.random()*92;
      el.style.setProperty("--sz", size.toFixed(0)+"px");
      var img=document.createElement("img");
      img.src=src; img.alt="";
      el.appendChild(img);
      party.appendChild(el);

      /* 从画面底部下方向上抛，横向铺开到全宽 */
      var col = k/(plan.length-1);                       /* 0 ~ 1 */
      var startX = W*(0.06 + col*0.88) + (Math.random()-0.5)*60;
      var startY = H + size*0.6 + Math.random()*120;
      /* 目标高度：让它们飞到画面各个高度，形成层次 */
      var peak = H*(0.10 + Math.random()*0.62);
      var rise = startY - peak;
      var g = 0.58;
      var vy0 = -Math.sqrt(2*g*rise);                    /* 由目标高度反推初速度 */

      toyBodies.push({
        el:el,
        x:startX,
        y:startY,
        vx:(Math.random()-0.5)*4.2,
        vy:vy0,
        g:g,
        rot:(Math.random()-0.5)*50,
        vr:(Math.random()-0.5)*9,
        sc:0, scT:1,
        size:size,
        delay: k*32 + Math.random()*140,
        born:performance.now(),
        rest:false
      });
    });
    if(toyRAF) cancelAnimationFrame(toyRAF);
    toyRAF=requestAnimationFrame(stepToys);
  }

  function stepToys(now){
    var H=window.innerHeight, W=window.innerWidth;
    for(var i=0;i<toyBodies.length;i++){
      var b=toyBodies[i];
      var age=now-b.born;
      if(age < b.delay){ continue; }

      if(!b.rest){
        b.vy += b.g;
        b.vx *= 0.997;
        b.x  += b.vx;
        b.y  += b.vy;
        b.rot+= b.vr;
        b.vr *= 0.992;

        var half=b.size*0.5;
        if(b.x < half){ b.x=half; b.vx=Math.abs(b.vx)*0.6; b.vr*=-0.6; }
        if(b.x > W-half){ b.x=W-half; b.vx=-Math.abs(b.vx)*0.6; b.vr*=-0.6; }

        /* 落到底部之下就回收重来，形成持续喷涌 */
        if(b.y > H + half*1.4){
          b.y = H + b.size*0.6 + Math.random()*90;
          var peak = H*(0.10 + Math.random()*0.62);
          b.vy = -Math.sqrt(2*b.g*Math.max(60,(b.y-peak)));
          b.vx = (Math.random()-0.5)*4.2;
          b.vr = (Math.random()-0.5)*9;
        }
      }
      b.sc += (b.scT-b.sc)*0.2;
      b.el.style.transform =
        "translate("+(b.x-b.size/2).toFixed(1)+"px,"+(b.y-b.size/2).toFixed(1)+"px)"+
        " rotate("+b.rot.toFixed(1)+"deg) scale("+b.sc.toFixed(3)+")";
      b.el.style.left="0"; b.el.style.top="0";
    }
    toyRAF=requestAnimationFrame(stepToys);
  }

  function stopToys(){
    if(toyRAF){ cancelAnimationFrame(toyRAF); toyRAF=null; }
    party.innerHTML=""; toyBodies.length=0;
  }

  function playSfx(){
    if(!musicOn) return;
    try{ sfx.currentTime=0; sfx.volume=0.85; var p=sfx.play(); if(p&&p.catch) p.catch(function(){}); }catch(e){}
  }

  function toFinale(){
    playSfx();
    curtain.classList.add("on");
    setTimeout(function(){
      party.classList.add("on");
      spawnToys();
      finaleWish.textContent = S.wish || "";
      finale.classList.add("on");
    }, 480);
  }

  function leaveFinale(){
    curtain.classList.remove("on");
    party.classList.remove("on");
    finale.classList.remove("on");
    stopToys();
  }

  againBtn.addEventListener("click", function(){
    leaveFinale();
    reset();
  });

  /* ================= 流程 ================= */
  function toWish(){
    S.step=1;
    blackout.classList.add("flash");
    setDark(true);
    tryPlayBGM();                 /* 此刻已有用户手势，可绕过自动播放限制 */
    R.style.setProperty("--dark","1");
    crest.style.opacity="0";
    light(1,760); light(0,1040); light(2,1290);

    kicker.textContent="your wish";
    title.textContent="许个愿";
    desc.innerHTML="写下来，或者<em>只在心里想</em>。";
    show(field);
    mainBtn.textContent="想好了";
    setTimeout(function(){ wishIn.focus(); }, 900);
  }
  function toBlow(){
    S.step=2; S.wish=wishIn.value.trim();
    hide(field); hide(mainBtn);
    kicker.textContent="one breath";
    title.textContent="对着话筒，吹";
    desc.innerHTML="风会把火苗压弯 —— <em>一口气吹到底</em>。";
    show(gauge);
    show(altBtn);
    micStart();
  }
  function done(){
    S.step=3;
    R.style.setProperty("--tilt","0deg");
    R.style.setProperty("--shear","0");
    R.style.setProperty("--stretch","1");
    R.style.setProperty("--shudder","0");
    for(var i=0;i<3;i++) sparkBurst(i,42,1.15);

    if(stream){ stream.getTracks().forEach(function(t){t.stop();}); stream=null; }
    if(ac){ ac.close(); ac=null; }
    S.mic=false;

    setTimeout(function(){
      hide(gauge); hide(altBtn); hide(tip);
      kicker.textContent="it's done";
      title.textContent="灭了";
      desc.textContent = S.wish ? "这句话只有蜡烛听见了。" : "没说出口的那句，也算数。";
      if(S.wish){ echo.textContent=S.wish; show(echo); }
    }, 1250);

    /* 余韵之后落黑幕，玩具礼物迸发 */
    setTimeout(toFinale, 2600);
  }
  function reset(){
    S.step=0; S.prog=0; S.live=0; S.manual=false; S.lit=[false,false,false];
    ready=false; cf=0; cs=0; cm=0; ch=0; base=0; baseMid=0; baseHi=0; spark.length=0; litQueue.length=0;
    blackout.classList.remove("flash");
    setDark(false);
    FL.forEach(function(f){ f.style.setProperty("--lit","0"); f.style.opacity="0"; });
    glow();
    R.style.setProperty("--dark","0");
    R.style.setProperty("--tilt","0deg");
    R.style.setProperty("--shear","0");
    R.style.setProperty("--stretch","1");
    R.style.setProperty("--shudder","0");
    crest.style.opacity="1";
    wishIn.value="";
    barFill.style.width="0%"; barLive.style.left="0%"; gaugePct.textContent="0%";
    hide(echo); hide(gauge); hide(field); hide(altBtn); hide(tip);
    leaveFinale();
    kicker.textContent="tonight";
    title.textContent="把灯关了吧";
    desc.textContent="房间暗下来，火才看得见。";
    mainBtn.textContent="关灯"; show(mainBtn);
  }

  mainBtn.addEventListener("click", function(){
    if(S.step===0) toWish();
    else if(S.step===1) toBlow();
    else if(S.step===3) reset();
  });
  wishIn.addEventListener("keydown", function(e){
    if(e.key==="Enter" && S.step===1) toBlow();
  });

  function on(e){ e.preventDefault(); hold=true; }
  function off(){ hold=false; }
  altBtn.addEventListener("mousedown",on);
  altBtn.addEventListener("touchstart",on,{passive:false});
  window.addEventListener("mouseup",off);
  window.addEventListener("touchend",off);
  altBtn.addEventListener("keydown",function(e){
    if(e.key===" "||e.key==="Enter"){ e.preventDefault(); hold=true; }
  });
  altBtn.addEventListener("keyup",off);

  setInterval(function(){
    if(S.step===2 && S.mic && ready && S.prog<.02 && !S.manual && altBtn.classList.contains("hidden")){
      show(altBtn); show(tip);
      tip.textContent="吹不动？按住这个按钮也行。";
    }
  }, 9000);

})();
</script>
</body>
